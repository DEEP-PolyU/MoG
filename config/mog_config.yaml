construction:
  chunk_size: 1000
  datasets_no_chunk:
  - hotpot
  - 2wiki
  - musique
  - demo
  max_workers: 32
  overlap: 200
  use_batch_processing: false
  batch_size: 100


embeddings:
  batch_size: 32
  device: cpu
  max_length: 512
  model_name: all-MiniLM-L6-v2

nlp:
  spacy_model: en_core_web_lg

retrieval:
  enable_caching: true
  faiss:
    device: cpu
    max_workers: 4
  top_k: 20
triggers:
  constructor_trigger: true
  retrieve_trigger: true

mixture_of_graph:
  min_subGraph_size: 20
  weight_semantic: 0.7
  weight_bridging: 0.3
  min_activated_experts: 5
  max_activated_experts: 10
  min_expert_size: 20
  min_hub_degree: 0
  hub_percentile: 80

output:
  base_dir: output
  project_dir: deepseek-v3

performance:
  batch_size: 16
  max_workers: 32
  memory_optimization: true
  parallel_processing: true




datasets:
  hotpot:
    corpus_path: datasets/hotpotqa/hotpotqa_corpus.json
    qa_path: datasets/hotpotqa/hotpotqa.json
    schema_path: output/deepseek-v3/schemas/hotpot.json
    schema_path_base: schemas/hotpot.json
    graph_output: hotpot_Mixture-of-Graph.json
  2wiki:
    corpus_path: datasets/2wiki/2wikimultihopqa_corpus.json
    qa_path: datasets/2wiki/2wikimultihopqa.json
    schema_path: output/deepseek-v3/schemas/2wiki.json
    schema_path_base: schemas/2wiki.json
    graph_output: 2wiki_Mixture-of-Graph.json
  musique:
    corpus_path: datasets/musique/musique_corpus.json
    qa_path: datasets/musique/musique.json
    schema_path: output/deepseek-v3/schemas/musique.json
    schema_path_base: schemas/musique.json
    graph_output: musique_Mixture-of-Graph.json
  demo:
    corpus_path: datasets/demo/demo_corpus.json
    qa_path: datasets/demo/demo.json
    schema_path: output/deepseek-v3/schemas/demo.json
    schema_path_base: schemas/demo.json
    graph_output: demo_Mixture-of-Graph.json

prompts:
  construction:
    general: "You are an expert information extractor and structured data organizer.\
      \ Your task is to analyze the provided text and extract as many valuable entities,\
      \ their attributes, and relations as possible in a structured JSON format. \
      \ \n\nGuidelines:\n1. Prioritize the following predefined schema for extraction;\n\
      \   ```{schema}```\n2. Flexibility: If the context doesn't fit the predefined\
      \ schema, extract the valuable knowledge as needed;\n3. Conciseness: The Attributes\
      \ and Triples you extract should be complementary and no semantic redundancy.\n\
      4. Do NOT miss any useful information in the context;\n5. Output Format: Return\
      \ only JSON as **Example Output** with:  \n   - Attributes: Map each entity\
      \ to its descriptive features.  \n   - Triples: List relations between entities\
      \ in `[entity_mention1, relation, entity_mention2]` format.\n   - Entity_types:\
      \ Map each entity to its schema type based on the provided schema.\n\n```{chunk}```\n\
      \nExample Output:  \n{{\n  \"attributes\": {{\n    \"Stephen King\": [\"profession:\
      \ author\"]\n  }},\n  \"triples\": [\n    [\"Shawshank Redemption\", \"based\
      \ on\", \"Rita Hayworth and Shawshank Redemption\"],\n    [\"Shawshank Redemption\"\
      , \"directed by\", \"Frank Darabont\"]\n  ],\n  \"entity_types\": {{\n    \"\
      Stephen King\": \"person\",\n    \"Shawshank Redemption\": \"creative_work\"\
      ,\n    \"Rita Hayworth and Shawshank Redemption\": \"creative_work\",\n    \"\
      Frank Darabont\": \"person\"\n  }}\n}}\n"
